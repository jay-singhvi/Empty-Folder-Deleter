[project]
name = "various-tools"
version = "0.9.0"
description = "Various Tools: a Windows toolkit for cleaning up, deduplicating and organizing files and media."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [{ name = "Jay Singhvi" }]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "platformdirs>=4.3",
    "typer>=0.15",
    "rich>=13.9",
    "send2trash>=1.8",
    "pathspec>=0.12",
    "openpyxl>=3.1",
]

[project.scripts]
various-tools = "various_tools.cli.main:main"
various-tools-gui = "various_tools.gui.app:main"

# Every tool registers itself here (plan §3.3). A new tool is one more line.
[project.entry-points."various_tools.tools"]
empty_folders = "various_tools.tools.empty_folders:TOOL"
project_export = "various_tools.tools.project_export:TOOL"
rename = "various_tools.tools.rename:TOOL"
duplicates = "various_tools.tools.duplicates:TOOL"
media_resize = "various_tools.tools.media_resize:TOOL"
organize_by_date = "various_tools.tools.organize_by_date:TOOL"
disk_usage = "various_tools.tools.disk_usage:TOOL"
sort_by_type = "various_tools.tools.sort_by_type:TOOL"
temp_cleaner = "various_tools.tools.temp_cleaner:TOOL"
media_convert = "various_tools.tools.media_convert:TOOL"
metadata_strip = "various_tools.tools.metadata_strip:TOOL"
set_date = "various_tools.tools.set_date:TOOL"
checksum = "various_tools.tools.checksum:TOOL"
empty_files = "various_tools.tools.empty_files:TOOL"
wrong_extension = "various_tools.tools.wrong_extension:TOOL"
corrupt_media = "various_tools.tools.corrupt_media:TOOL"

[dependency-groups]
gui = [
    "pyside6>=6.10",
]
media = [
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "rawpy>=0.24",
    "imagehash>=4.3",
    "numpy>=2.1",
]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pre-commit>=4.0",
    "pytest-cov>=7.1.0",
    "types-openpyxl>=3.1.5.20261017",
    "pyinstaller>=6.22.3",
]

[tool.uv]
# `uv sync` installs everything, including the GUI, media and dev groups.
default-groups = ["dev", "gui", "media"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/various_tools"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
# Python files only: the plan and other Markdown are not reformatted by ruff.
include = ["**/*.py", "**/*.pyi"]
# The legacy reference scripts used by the parity tests are kept unchanged, so they are not linted.
exclude = ["tests/fixtures/legacy_reference"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
qt_api = "pyside6"
filterwarnings = ["error"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["tests/fixtures/legacy_reference"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
# Strict type checking for the core library, per AGENTS.md.
strict = ["src/various_tools/core"]
venvPath = "."
venv = ".venv"

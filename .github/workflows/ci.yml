name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # uv reads .python-version (3.14) and downloads that interpreter if needed.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # ffmpeg and ffprobe for the media tests. Those tests skip themselves when the programs are
      # missing, so a failed install shows up as skipped tests rather than a red build.
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y
        continue-on-error: true

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest
